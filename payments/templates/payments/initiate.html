{% extends 'base.html' %}
{% block title %}Initiate Payment{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Initiate Payment</h1>
<form method="post" class="space-y-4 bg-white p-6 rounded shadow">
    {% csrf_token %}
    <div>
        <label class="block text-sm font-medium mb-1">Provider</label>
        <select name="provider" class="w-full p-2 border rounded" required>
            <option value="mtn">MTN Mobile Money</option>
            <option value="orange">Orange Money</option>
        </select>
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Phone Number</label>
        <input type="tel" name="phone" class="w-full p-2 border rounded" required>
    </div>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Pay</button>
</form>
{% endblock %}
