{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-8">
    <h1 class="text-2xl font-semibold mb-4">Register</h1>
    <form method="post" class="space-y-4 bg-white p-6 rounded shadow">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="flex items-center justify-between">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors duration-200">Register</button>
            <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:text-blue-700 transition-colors duration-200">Already have an account?</a>
        </div>
    </form>
</div>
{% endblock %}
