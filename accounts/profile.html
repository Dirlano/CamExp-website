{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<h1 class="text-2xl">Your Profile</h1>
<p>User Type: {{ profile.user_type }}</p>
<p>Bio: {{ profile.bio }}</p>
<p>Location: {{ profile.location }}</p>
<a href="{% url 'edit_profile' %}" class="bg-green-500 text-white p-2">Edit Profile</a>
{% endblock %}
