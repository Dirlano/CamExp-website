{% extends 'base.html' %}
{% block title %}Respond to Request{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Respond to Request</h1>
<div class="bg-white p-6 rounded shadow space-y-2">
    <h2 class="text-xl font-bold">{{ req.title }}</h2>
    <p>{{ req.description }}</p>
    <p class="text-gray-700">Budget: {{ req.budget }} FCFA</p>
</div>
<form method="post" class="mt-4">
    {% csrf_token %}
    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Accept Request</button>
    <a href="{% url 'dashboard' %}" class="ml-2 text-blue-600 hover:underline">Back</a>
    
</form>
{% endblock %}
