{% extends 'base.html' %}
{% block title %}Create Listing{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Create Service Listing</h1>
<form method="post" class="space-y-4 bg-white p-6 rounded shadow">
    {% csrf_token %}
    <div>
        <label class="block text-sm font-medium mb-1">Title</label>
        <input type="text" name="title" class="w-full p-2 border rounded" required>
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Description</label>
        <textarea name="description" class="w-full p-2 border rounded" rows="4" required></textarea>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
            <label class="block text-sm font-medium mb-1">Price (FCFA)</label>
            <input type="number" name="price" class="w-full p-2 border rounded" required>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Category</label>
            <input type="text" name="category" class="w-full p-2 border rounded" required>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Location</label>
            <input type="text" name="location" class="w-full p-2 border rounded" required>
        </div>
    </div>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Create</button>
</form>
{% endblock %}
