{% extends 'base.html' %}
{% block title %}React to Post{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">React to Post</h1>
<div class="bg-white p-6 rounded shadow mb-4">
    <h2 class="text-lg font-semibold">{{ post.title }}</h2>
    <p>{{ post.description }}</p>
    <p class="text-gray-700">Price: {{ post.price }} FCFA</p>
</div>
<form method="post" class="space-y-4 bg-white p-6 rounded shadow">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">React</button>
</form>
{% endblock %}
