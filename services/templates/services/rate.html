{% extends 'base.html' %}
{% block title %}Rate Expert{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Rate {{ expert.user.username }}</h1>
<form method="post" class="space-y-4 bg-white p-6 rounded shadow">
    {% csrf_token %}
    <div>
        <label class="block text-sm font-medium mb-1">Score (1-5)</label>
        <input type="number" name="score" min="1" max="5" class="w-full p-2 border rounded" required>
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Review</label>
        <textarea name="review" rows="4" class="w-full p-2 border rounded"></textarea>
    </div>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Submit Rating</button>
</form>
{% endblock %}
