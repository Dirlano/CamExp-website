{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Project Dashboard</h1>
<ul class="space-y-3">
    {% for project in projects %}
    <li class="bg-white p-4 rounded shadow flex items-center justify-between">
        <div>
            <p class="font-medium">{{ project.request.title }}</p>
            <p class="text-gray-600 text-sm">Status: {{ project.status }}</p>
        </div>
        <a href="{% url 'schedule' project.id %}" class="text-blue-600 hover:underline">View schedule</a>
    </li>
    {% empty %}
    <li class="text-gray-600">No projects yet.</li>
    {% endfor %}
 </ul>
{% endblock %}
